name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (FastAPI + PostgreSQL/pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumora
          POSTGRES_PASSWORD: lumora
          POSTGRES_DB: lumora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumora" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lumora:lumora@localhost:5432/lumora_test
      TEST_DATABASE_URL: postgresql+psycopg://lumora:lumora@localhost:5432/lumora_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Migrations (upgrade / downgrade / upgrade / drift check)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Tests on PostgreSQL + pgvector
        run: pytest -o addopts="" -q
      - name: Tests on SQLite
        env:
          TEST_DATABASE_URL: ""
          DATABASE_URL: ""
        run: pytest -o addopts="" -q

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lumora-api ./backend
      - run: docker build -t lumora-web ./frontend
      - name: Compose smoke test
        run: |
          echo "JWT_SECRET=ci-only-$(openssl rand -hex 16)" > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health && break; sleep 3; done
          curl -sf http://localhost:8080/api/health
          curl -sf http://localhost:8080/ | grep -q "<div id=\"root\">"
          docker compose down -v
