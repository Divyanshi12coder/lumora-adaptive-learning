line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "S311", "SIM108", "E501"]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/seed/run.py" = ["S105"]
"app/core/config.py" = ["S105"]
