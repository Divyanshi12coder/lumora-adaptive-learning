# Render Blueprint: Dockerised FastAPI backend.
# PostgreSQL is hosted in the existing Render Postgres resource.
# The frontend is deployed separately on Vercel.

services:
  - type: web
    name: lumora-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: ENVIRONMENT
        value: production

      - key: CORS_ORIGINS
        sync: false

      - key: AI_PROVIDER
        value: demo

      - key: AI_API_KEY
        sync: false

      - key: AI_MODEL
        sync: false

      - key: EMBEDDING_PROVIDER
        value: local

      - key: SEED_DEMO_USER
        value: "true"