# Render Blueprint: PostgreSQL (pgvector is available as an extension) + Dockerised API.
# The frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md).
databases:
  - name: lumora-db
    databaseName: lumora
    user: lumora
    plan: free

services:
  - type: web
    name: lumora-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://lumora.vercel.app
      - key: AI_PROVIDER
        value: demo
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: SEED_DEMO_USER
        value: "true"
